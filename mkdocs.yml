site_name: aRST Docs
site_url: https://rwth-bannwarthlab.pages.git.nrw/arst/
repo_url: https://gitlab.git.nrw/rwth-bannwarthlab/arst
repo_name: rwth-bannwarthlab/arst

theme:
  name: material
  favicon: stylesheets/logo_favicon.png
  features:
#    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - navigation.indexes

  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Dark mode

# This defines the left sidebar structure.
nav:
  - Home: index.md
  - Installation: installation.md
  - Documentation:
      - Inputfile Documentation: documentation/inputfile.md
  # 2.2.0 pages, kept until they are rewritten for 2.3.0
  - Archive 2.2.0:
#      - Overview: overview.md
      - Installation: archive-2.2.0/installation.md
      - Documentation:
          - archive-2.2.0/documentation/index.md
          - Option Documentation: archive-2.2.0/documentation/option.md
          - Inputfile Documentation: archive-2.2.0/documentation/inputfile.md
#          - documentation/inputfile/index.md
#          - Inputfile example: documentation/inputfile/input_example.md
      - Examples and Guides:
          - examples/index.md
          - Intermolecular Reaction Search: examples/interA.md
          - Inramolecular Association Search: examples/intraA.md
          - Dissociation Search: examples/disso.md
          - Mechanochemical Analysis: examples/mechano.md

markdown_extensions:
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.superfences
  - pymdownx.details


extra_css:
  - stylesheets/extra.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra:
  version:
    provider: mike   # version dropdown, reads ../versions.json written by CI
#  social:
#    - icon: fontawesome/brands/gitlab
#      link: https://gitlab.com/namespace/project
