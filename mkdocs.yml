site_name: aRST Docs
site_url: https://bannwarthlab.pages.rwth-aachen.de/aRST/
repo_url: https://git.rwth-aachen.de/bannwarthlab/aRST
repo_name: bannwarthlab/aRST

theme:
  name: material
#  logo: assets/logo.png
  features:
#    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - navigation.indexes

  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Dark mode

# This defines the left sidebar structure.
nav:
  - Home: index.md
  - Overview: overview.md
  - Installation: installation.md
  - Documentation:
      - documentation/index.md
      - Option Documentation: documentation/option.md
      - Inputfile Documentation: documentation/inputfile.md
#          - documentation/inputfile/index.md
#          - Inputfile example: documentation/inputfile/input_example.md
#  - Examples:
#      - A:
  - Examples and Guides:
      - examples/index.md
      - Intermolecular Reaction Search: examples/interA.md
      - Inramolecular Association Search: examples/intraA.md
      - Dissociation Search: examples/disso.md

markdown_extensions:
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.superfences
  - pymdownx.details


extra_css:
  - stylesheets/extra.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
#extra:
