stages:
  - deploy

# The site is assembled in public/:
#   docs branch (mkdocs build)  -> public/2.3.0   (latest)
#   archive/<version>/ (frozen, prebuilt HTML, copied as-is) -> public/<version>
# To archive a version: build it with `mkdocs build --site-dir archive/<version>`
# and commit the folder; it is picked up automatically.
pages:
  stage: deploy

  variables:
    LATEST: "2.3.0"

  # Runs on the shell runner (z1-docker is broken), so use a throwaway venv
  before_script:
    - python3 --version
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --quiet mkdocs mkdocs-material

  script:
    - mkdocs build --site-dir public/$LATEST
    - cp -r archive/* public/
    # versions.json drives the Material version dropdown
    - |
      python - <<PY
      import json, os
      latest = os.environ["LATEST"]
      versions = [{"version": latest, "title": f"{latest} (latest)", "aliases": ["latest"]}]
      old = sorted(os.listdir("archive"), key=lambda v: tuple(map(int, v.split("."))), reverse=True)
      versions += [{"version": v, "title": v, "aliases": []} for v in old]
      json.dump(versions, open("public/versions.json", "w"), indent=2)
      PY
    # root URL redirects to the latest version
    - echo "<!doctype html><meta http-equiv=\"refresh\" content=\"0; url=$LATEST/\"><link rel=\"canonical\" href=\"$LATEST/\">" > public/index.html

  artifacts:
    paths:
      - public

  rules:
    - if: '$CI_COMMIT_BRANCH == "docs"'

  tags:
    - shell
